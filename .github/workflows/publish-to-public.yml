name: Sincronizar Main a Repositorio Publico

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Sincronizar a repositorio publico
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PUBLIC_REPO_TOKEN }}
        with:
          source-directory: '.'
          destination-github-username: 'TheLastBonny'
          destination-repository-name: 'Good-Service-PlaceHolder-Public'
          user-email: 'action@github.com'
          target-branch: 'main'
